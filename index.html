<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Анечка 🤍</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.card {
    max-width: 500px;
    width: 100%;
    text-align: center;
    animation: appear 1s ease;
}

.label {
    color: #888;
    font-size: 11px;
    letter-spacing: 4px;
    margin-bottom: 25px;
}

h1 {
    font-size: clamp(70px, 17vw, 110px);
    margin: 0;
    font-weight: 800;
    letter-spacing: -6px;
}

.age {
    color: #aaa;
    letter-spacing: 7px;
    margin-top: 12px;
    font-size: 13px;
}

.heart {
    font-size: 28px;
    margin: 30px 0;
}

.line {
    width: 40px;
    height: 1px;
    background: #777;
    margin: 25px auto;
}

.message {
    color: #ccc;
    font-size: 15px;
    line-height: 1.9;
    font-weight: 300;
}

button {
    margin-top: 35px;
    padding: 16px 28px;
    background: white;
    color: black;
    border: 1px solid white;
    font-size: 11px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: .3s;
}

button:hover {
    background: black;
    color: white;
}

.extra {
    display: none;
    margin-top: 25px;
    color: #ddd;
    font-size: 15px;
    line-height: 1.8;
}

.extra.show {
    display: block;
    animation: appear .7s ease;
}

.footer {
    margin-top: 45px;
    color: #666;
    font-size: 10px;
    letter-spacing: 4px;
}

.floating {
    position: fixed;
    bottom: -30px;
    pointer-events: none;
    animation: rise 5s linear forwards;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes rise {
    to {
        transform: translateY(-110vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<main class="card">

    <div class="label">TODAY IS YOUR DAY</div>

    <h1>Аня</h1>

    <div class="age">15 YEARS OLD</div>

    <div class="heart">🤍</div>

    <div class="line"></div>

    <div class="message">
        Анечка, тебе уже 15 годиков,
        пора на пенсию, но ты не переживай,
        я люблю постарше.

        <b

        Желаю тебе счастья, здоровья, удачи,
        любви (ко мне), денег (побольше).

        <b

        Дальше не придумал 🤍

        <br

       В общем, поздравляю тебя с Днюхой, мать!
    </div>

    <button onclick="openLetter()">
        OPEN YOUR LETTER
    </button>

    <div class="extra" id="extra">
        Ну и ещё раз с днём рождения!
        Люблю, ценю, обожаю 🤍
    </div>

    <div class="footer">MADE FOR ANYA</div>

</main>

<script>
function openLetter() {
    const extra = document.getElementById("extra");
    extra.classList.toggle("show");

    if (extra.classList.contains("show")) {
        for (let i = 0; i < 15; i++) {
            const heart = document.createElement("div");
            heart.className = "floating";
            heart.textContent = "🤍";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration =
                (3 + Math.random() * 4) + "s";

            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 7500);
        }
    }
}
</script>

</body>
</html>
